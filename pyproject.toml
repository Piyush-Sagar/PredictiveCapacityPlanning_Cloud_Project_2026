[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capplan"
version = "0.2.0"
description = "Predictive capacity planning for video streaming — local simulation of the AWS reference architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "torch>=2.2",
  "boto3>=1.34",
  "moto[server]>=5.0",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src/ai_models", "src/database", "src/aws", "src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
